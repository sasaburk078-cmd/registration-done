<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация успешно завершена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#a855f7;
    --purple-soft:#8A2BE2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    background:#0b0b10;
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    color:#fff;
    overflow:hidden;
    position:relative;
  }
  /* мягкие светящиеся пятна на фоне */
  body::before,
  body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    z-index:0;
    pointer-events:none;
  }
  body::before{
    width:520px;height:520px;
    background:rgba(138,43,226,.55);
    top:-160px;left:-140px;
    animation:float1 14s ease-in-out infinite alternate;
  }
  body::after{
    width:460px;height:460px;
    background:rgba(168,85,247,.35);
    bottom:-180px;right:-120px;
    animation:float2 18s ease-in-out infinite alternate;
  }
  @keyframes float1{
    from{transform:translate3d(0,0,0) scale(1);}
    to{transform:translate3d(60px,50px,0) scale(1.15);}
  }
  @keyframes float2{
    from{transform:translate3d(0,0,0) scale(1.1);}
    to{transform:translate3d(-70px,-40px,0) scale(0.95);}
  }

  .card{
    position:relative;
    z-index:1;
    max-width:900px;
    text-align:center;
    padding:56px 44px;
    border-radius:24px;
    background:rgba(28,28,32,.72);
    border:1px solid rgba(168,85,247,.28);
    box-shadow:0 0 60px rgba(138,43,226,.25), inset 0 0 60px rgba(138,43,226,.06);
    backdrop-filter:blur(14px);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(26px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#d8b4fe;
    border:1px solid rgba(168,85,247,.45);
    border-radius:999px;
    padding:8px 18px;
    margin-bottom:28px;
    background:rgba(168,85,247,.10);
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--purple);
    box-shadow:0 0 12px var(--purple);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.45; transform:scale(.75);}
  }

  h1{
    margin:0;
    font-size:clamp(30px, 6vw, 62px);
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.02em;
    background:linear-gradient(92deg,#ffffff 0%,#e9d5ff 45%,#a855f7 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(168,85,247,.35);
  }

  .line{
    width:120px;height:3px;
    margin:34px auto 0;
    border-radius:3px;
    background:linear-gradient(90deg, transparent, var(--purple), transparent);
    box-shadow:0 0 18px rgba(168,85,247,.9);
    animation:grow 1.1s .5s ease both;
  }
  @keyframes grow{
    from{width:0; opacity:0;}
    to{width:120px; opacity:1;}
  }

  @media (max-width:560px){
    .card{padding:38px 22px; border-radius:20px;}
    body::before,body::after{filter:blur(80px);}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>Готово</span>
    <h1>Регистрация успешно завершена! Удачи тебе в жизни!</h1>
    <div class="line"></div>
  </main>
</body>
</html>
